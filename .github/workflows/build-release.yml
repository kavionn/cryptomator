name: 🏗️ Build & Release APK

on:
  # ── Auto-trigger saat ada tag baru (format: v1.2.3 atau 1.2.3) ──
  push:
    tags:
      - 'v*.*.*'
      - '[0-9]+.[0-9]+.[0-9]*'

  # ── Trigger manual dari tab Actions ──
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Jenis build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      create_release:
        description: 'Buat GitHub Release?'
        required: true
        default: 'false'
        type: boolean
      release_tag:
        description: 'Tag untuk release (kosongkan = pakai commit SHA)'
        required: false
        default: ''

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ──────────────────────────────────────────────
      # 1. Checkout
      # ──────────────────────────────────────────────
      - name: Checkout kode
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      # ──────────────────────────────────────────────
      # 2. Setup Java 17
      # ──────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # ──────────────────────────────────────────────
      # 3. Pastikan file bypass tidak tertimpa
      # ──────────────────────────────────────────────
      - name: Verifikasi file bypass lisensi
        run: |
          MAIN_FILE="domain/src/main/java/org/cryptomator/domain/usecases/DoLicenseCheck.java"
          TEST_FILE="domain/src/test/java/org/cryptomator/domain/usecases/DoLicenseCheckTest.java"

          echo "=== Mengecek file bypass ==="

          if grep -q "BYPASS_MAIL" "$MAIN_FILE"; then
            echo "✅ DoLicenseCheck.java — bypass aktif"
          else
            echo "❌ PERINGATAN: DoLicenseCheck.java tidak mengandung bypass!"
            exit 1
          fi

          if grep -q "BypassTokenAcceptance\|BYPASS_MAIL\|user@example.com" "$TEST_FILE"; then
            echo "✅ DoLicenseCheckTest.java — test bypass aktif"
          else
            echo "❌ PERINGATAN: DoLicenseCheckTest.java tidak sesuai bypass!"
            exit 1
          fi

      # ──────────────────────────────────────────────
      # 4. Tentukan versi & jenis build
      # ──────────────────────────────────────────────
      - name: Tentukan versi dan tipe build
        id: meta
        run: |
          # Cek apakah trigger dari tag
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            BUILD_TYPE="release"
            IS_RELEASE="true"
          else
            # Trigger manual
            BUILD_TYPE="${{ github.event.inputs.release_type || 'debug' }}"
            IS_RELEASE="${{ github.event.inputs.create_release || 'false' }}"
            RAW_TAG="${{ github.event.inputs.release_tag }}"

            if [[ -z "$RAW_TAG" ]]; then
              echo "🔍 Tag kosong, mengambil tag terbaru dari upstream cryptomator/android..."
              UPSTREAM_TAG=$(curl -sf \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/cryptomator/android/tags" \
                | grep '"name"' | head -1 | sed 's/.*"name": *"//;s/".*//')

              if [[ -z "$UPSTREAM_TAG" ]]; then
                echo "⚠️  Gagal fetch tag upstream, fallback ke commit SHA"
                VERSION="manual-$(echo ${{ github.sha }} | cut -c1-7)"
              else
                echo "✅ Tag upstream ditemukan: $UPSTREAM_TAG"
                VERSION="$UPSTREAM_TAG"
              fi
            else
              VERSION="$RAW_TAG"
            fi
          fi

          echo "version=$VERSION"       >> "$GITHUB_OUTPUT"
          echo "build_type=$BUILD_TYPE" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"

          echo "──────────────────────────────────"
          echo "  Versi    : $VERSION"
          echo "  Tipe     : $BUILD_TYPE"
          echo "  Release  : $IS_RELEASE"
          echo "──────────────────────────────────"

      # ──────────────────────────────────────────────
      # 5. Grant permission gradlew
      # ──────────────────────────────────────────────
      - name: Grant execute permission untuk gradlew
        run: chmod +x gradlew

      # ──────────────────────────────────────────────
      # 6. Build APK
      # ──────────────────────────────────────────────
      - name: Build APK (${{ steps.meta.outputs.build_type }})
        run: |
          BUILD_TYPE="${{ steps.meta.outputs.build_type }}"

          if [[ "$BUILD_TYPE" == "release" ]]; then
            echo "🔨 Building release APK (unsigned)..."
            ./gradlew assembleApkstoreRelease --stacktrace --no-daemon \
              -PversionName="${{ steps.meta.outputs.version }}"
          else
            echo "🔨 Building debug APK..."
            ./gradlew assembleApkstoreDebug --stacktrace --no-daemon \
              -PversionName="${{ steps.meta.outputs.version }}"
          fi
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx2g"

      # ──────────────────────────────────────────────
      # 7. Cari APK hasil build
      # ──────────────────────────────────────────────
      - name: Kumpulkan APK hasil build
        id: apk
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          BUILD_TYPE="${{ steps.meta.outputs.build_type }}"

          # Cari APK yang dihasilkan
          APK_PATH=$(find . -name "*.apk" \
            -path "*/apkstore/*" \
            ! -path "*/test*" \
            | head -1)

          if [[ -z "$APK_PATH" ]]; then
            APK_PATH=$(find . -name "*.apk" ! -path "*/test*" | head -1)
          fi

          if [[ -z "$APK_PATH" ]]; then
            echo "❌ Tidak ada APK yang ditemukan!"
            find . -name "*.apk" || true
            exit 1
          fi

          echo "apk_source=$APK_PATH"   >> "$GITHUB_OUTPUT"
          echo "✅ APK ditemukan: $APK_PATH"

      # ──────────────────────────────────────────────
      # 8. Sign APK
      #    - Release : pakai keystore dari GitHub Secret
      #    - Debug   : pakai debug.keystore bawaan repo
      # ──────────────────────────────────────────────
      - name: Sign APK (release)
        id: sign_release
        if: steps.meta.outputs.build_type == 'release'
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          APK_SRC="${{ steps.apk.outputs.apk_source }}"
          APK_SIGNED="cryptomator-${VERSION}.apk"

          # Decode keystore dari secret (base64)
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > /tmp/release.keystore

          # Sign menggunakan apksigner (sudah tersedia di Android SDK)
          ${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools/ | tail -1)/apksigner sign \
            --ks /tmp/release.keystore \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out "$APK_SIGNED" \
            "$APK_SRC"

          echo "apk_final=$APK_SIGNED" >> "$GITHUB_OUTPUT"
          echo "✅ APK release berhasil di-sign: $APK_SIGNED"

          # Hapus keystore dari filesystem setelah dipakai
          rm -f /tmp/release.keystore

      - name: Sign APK (debug)
        id: sign_debug
        if: steps.meta.outputs.build_type == 'debug'
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          APK_SRC="${{ steps.apk.outputs.apk_source }}"
          APK_SIGNED="cryptomator-${VERSION}-debug.apk"

          # Sign menggunakan debug.keystore bawaan repo
          ${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools/ | tail -1)/apksigner sign \
            --ks presentation/debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$APK_SIGNED" \
            "$APK_SRC"

          echo "apk_final=$APK_SIGNED" >> "$GITHUB_OUTPUT"
          echo "✅ APK debug berhasil di-sign: $APK_SIGNED"

      # ──────────────────────────────────────────────
      # 9. Gabungkan output path APK final
      # ──────────────────────────────────────────────
      - name: Tentukan path APK final
        id: final
        run: |
          BUILD_TYPE="${{ steps.meta.outputs.build_type }}"
          if [[ "$BUILD_TYPE" == "release" ]]; then
            APK="${{ steps.sign_release.outputs.apk_final }}"
          else
            APK="${{ steps.sign_debug.outputs.apk_final }}"
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "✅ APK final: $APK"

      # ──────────────────────────────────────────────
      # 10a. Generate SHA-256 checksum
      #      File ini dibutuhkan oleh fitur "Periksa Pembaruan" di app
      # ──────────────────────────────────────────────
      - name: Generate SHA-256 checksum
        id: sha256
        run: |
          APK="${{ steps.final.outputs.apk }}"
          SHA256_FILE="${APK}.sha256"

          # Hitung hash SHA-256 dan simpan hanya nilai hex-nya (tanpa nama file)
          sha256sum "$APK" | awk '{print $1}' > "$SHA256_FILE"

          echo "sha256_file=$SHA256_FILE" >> "$GITHUB_OUTPUT"
          echo "✅ SHA-256 checksum:"
          cat "$SHA256_FILE"

      # ──────────────────────────────────────────────
      # 10. Verifikasi signature APK
      # ──────────────────────────────────────────────
      - name: Verifikasi signature APK
        run: |
          APK="${{ steps.final.outputs.apk }}"
          echo "=== Verifikasi Signature ==="
          ${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools/ | tail -1)/apksigner verify \
            --verbose "$APK" 2>&1 | head -20
          echo "✅ Verifikasi selesai"

      # ──────────────────────────────────────────────
      # 11. Upload artifact (selalu tersimpan)
      # ──────────────────────────────────────────────
      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.build_type }}
          path: ${{ steps.final.outputs.apk }}
          retention-days: 30

      # ──────────────────────────────────────────────
      # 12. Buat GitHub Release (hanya jika diperlukan)
      # ──────────────────────────────────────────────
      - name: Buat GitHub Release
        if: steps.meta.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: "Cryptomator Android ${{ steps.meta.outputs.version }}"
          body: |
            ## 🚀 Cryptomator Android ${{ steps.meta.outputs.version }}

            > **Build otomatis** dari tag `${{ steps.meta.outputs.version }}`
            > Lisensi **bypass** aktif — tidak memerlukan lisensi untuk digunakan.

            ### 📦 File
            | File | Keterangan |
            |------|-----------|
            | `${{ steps.final.outputs.apk }}` | APK signed, siap install |

            ### ✅ Signing Info
            - Build **release**: signed dengan keystore dari GitHub Secrets
            - Build **debug**: signed dengan `debug.keystore` bawaan repo

            ### ℹ️ Cara Install
            1. Download APK di bawah
            2. Aktifkan "Sumber tidak dikenal" di pengaturan Android
            3. Install APK

            ---
            **Commit**: `${{ github.sha }}`
            **Build**: `${{ github.run_id }}`
          files: |
            ${{ steps.final.outputs.apk }}
            ${{ steps.sha256.outputs.sha256_file }}
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
